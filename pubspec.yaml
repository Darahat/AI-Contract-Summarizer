name: ai_contract_summarizer
description: AI-powered contract analysis and summarization tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI & Navigation
  go_router: ^13.0.0
  cupertino_icons: ^1.0.6

  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  pdf: ^3.10.7
  syncfusion_flutter_pdf: ^24.1.41

  # API & Networking
  http: ^1.1.2
  dio: ^5.4.0

  # Data Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # AI/ML
  google_generative_ai: ^0.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/fonts/
